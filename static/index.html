<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>化工装置变更与工艺安全管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    section { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    h1 { margin-bottom: .25rem; }
    h2 { font-size: 1.05rem; margin-top: 0; }
    label { display: block; font-size: .85rem; margin: .4rem 0 .15rem; color: #374151; }
    input, select, textarea { padding: .4rem .5rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; }
    button { padding: .45rem .8rem; cursor: pointer; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; }
    button.secondary { background: #fff; color: #2563eb; }
    button.danger { border-color: #b91c1c; background: #b91c1c; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; margin-top: .5rem; }
    th, td { border: 1px solid #e5e7eb; padding: .35rem .5rem; text-align: left; }
    th { background: #f9fafb; }
    .bad { color: #b91c1c; font-weight: 600; }
    .ok { color: #047857; }
    .muted { color: #6b7280; font-size: .85rem; }
    pre { background: #f3f4f6; padding: .75rem; border-radius: 8px; overflow-x: auto; font-size: .8rem; max-height: 320px; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; }
    .row > div { display: flex; flex-direction: column; }
    #result { white-space: pre-wrap; word-break: break-all; min-height: 2.5rem; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; background: #e0e7ff; color: #3730a3; }
  </style>
</head>
<body>
<main>
  <h1>化工装置变更与工艺安全管理</h1>
  <p class="muted">投产观察：设置观察截止时间、按采样点登记读数，超限累计异常；观察期结束且异常全部处置后方可关闭，存在未处置异常时仅安全员可批准回退。</p>

  <section>
    <h2>调用身份</h2>
    <div class="row">
      <div><label>用户 ID</label><input id="userId" value="eng-1"></div>
      <div><label>角色</label>
        <select id="role">
          <option value="admin">admin（管理员）</option>
          <option value="engineer" selected>engineer（工程人员）</option>
          <option value="safety">safety（安全员）</option>
          <option value="operator">operator（操作人员）</option>
          <option value="verifier">verifier（验证人员）</option>
          <option value="viewer">viewer（只读）</option>
        </select>
      </div>
      <div style="align-self:center"><button class="secondary" onclick="loadChanges()">刷新变更列表</button></div>
    </div>
  </section>

  <section>
    <h2>变更申请</h2>
    <div class="row">
      <div><label>选择变更</label><select id="changeSelect" style="min-width:320px"></select></div>
      <div style="align-self:center"><button onclick="loadSelected()">加载</button></div>
    </div>
    <p class="muted">当前状态：<span id="changeStatus" class="badge">未加载</span> 版本：<span id="changeVersion">-</span></p>
    <div class="row">
      <div><label>观察截止时间（投产引导用）</label><input id="deadline" type="datetime-local" style="width:230px"></div>
      <div style="align-self:center"><button onclick="bootstrap()" title="创建装置与变更，一路推进到投产（含观察截止时间）">演示引导至投产</button></div>
    </div>
  </section>

  <section>
    <h2>投用观察登记（工程人员）</h2>
    <div class="row">
      <div><label>采样点</label><input id="point" value="P-101"></div>
      <div><label>下限</label><input id="minLimit" type="number" step="any" value="0" style="width:90px"></div>
      <div><label>上限</label><input id="maxLimit" type="number" step="any" value="10" style="width:90px"></div>
      <div><label>读数</label><input id="value" type="number" step="any" style="width:100px"></div>
      <div><label>读数时间</label><input id="readAt" type="datetime-local" style="width:210px"></div>
      <div style="align-self:center"><button onclick="submitReading()">提交读数</button></div>
    </div>
    <p class="muted">同一采样点可重复上报，历次读数全部保留；异常按超限次数累计，最新读数用于判断当前状态。</p>
    <div id="summary"></div>
  </section>

  <section>
    <h2>异常处置与关闭</h2>
    <div class="row">
      <div><label>异常编号</label><input id="anomalyId" type="number" style="width:100px"></div>
      <div><label>处置说明</label><input id="disposition" style="width:280px" placeholder="例如：更换探头后复测正常"></div>
      <div style="align-self:center"><button onclick="disposeAnomaly()">登记处置</button></div>
    </div>
    <div class="row" style="margin-top:.6rem">
      <div><label>回退原因（存在未处置异常时须 safety）</label><input id="rollbackReason" style="width:280px"></div>
      <div style="align-self:center"><button class="danger" onclick="rollback()">批准回退</button></div>
      <div><label>关闭结论（须过观察截止时间且无未处置异常）</label><input id="outcome" style="width:260px" placeholder="观察正常，关闭"></div>
      <div style="align-self:center"><button onclick="closeChange()">关闭申请</button></div>
    </div>
    <div id="closeResult"></div>
  </section>

  <section>
    <h2>对象数据 / 接口返回</h2>
    <pre id="result">等待操作</pre>
  </section>
</main>
<script>
let current = null;

function headers(role, userId) {
  return {
    'Content-Type': 'application/json',
    'X-Role': role || document.getElementById('role').value,
    'X-User-Id': userId || document.getElementById('userId').value,
  };
}

async function api(path, options) {
  const response = await fetch(path, options);
  const payload = await response.json();
  if (!response.ok) {
    throw new Error((payload.type || 'Error') + ': ' + payload.error);
  }
  return payload;
}

function show(payload) {
  document.getElementById('result').textContent = JSON.stringify(payload, null, 2);
}

function showError(err) {
  document.getElementById('result').textContent = '请求失败：' + err.message;
}

function localInput(value) {
  return new Date(value).toISOString().slice(0, 16);
}

async function act(action, data, role, userId) {
  if (!current) throw new Error('请先加载一个变更');
  const payload = await api('/api/entities/' + encodeURIComponent(current.id) + '/actions', {
    method: 'POST',
    headers: headers(role, userId),
    body: JSON.stringify({ action, data, expected_version: current.version }),
  });
  current = payload;
  render();
  return payload;
}

async function loadChanges() {
  const items = await api('/api/changes');
  const select = document.getElementById('changeSelect');
  select.innerHTML = '';
  items.forEach(item => {
    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = item.id.slice(0, 8) + ' — ' + (item.data.description || '') + ' [' + item.status + ']';
    select.appendChild(option);
  });
  return items;
}

async function loadSelected() {
  const id = document.getElementById('changeSelect').value;
  current = await api('/api/entities/' + encodeURIComponent(id));
  render();
}

async function bootstrap() {
  try {
    const deadline = document.getElementById('deadline').value;
    if (!deadline) throw new Error('请选择观察截止时间');
    const unit = await api('/api/units', {
      method: 'POST', headers: headers('admin'),
      body: JSON.stringify({ name: 'Reactor-' + Date.now().toString(36), location: 'Plant-A' }),
    });
    const change = await api('/api/changes', {
      method: 'POST', headers: headers('admin'),
      body: JSON.stringify({ unit_id: unit.id, description: '报警阈值变更' }),
    });
    const step = async (action, data, role, userId) => {
      const body = { action, data, expected_version: null };
      const res = await api('/api/entities/' + encodeURIComponent(change.id) + '/actions', {
        method: 'POST', headers: headers(role, userId), body: JSON.stringify(body),
      });
      Object.assign(change, res);
      return res;
    };
    await step('assess', { risk_level: 'low', analyst: 'eng-1' }, 'admin');
    await step('approve', { approvals: ['safety-1'], permit_id: 'MOC-' + Date.now().toString(36) }, 'safety', 'safety-1');
    await step('implement', { procedure_version: 'v2' }, 'admin');
    const commissioned = await step('commission', { tests_passed: true, observation_deadline: deadline }, 'admin');
    await loadChanges();
    document.getElementById('changeSelect').value = commissioned.id;
    current = commissioned;
    render();
    show(commissioned);
  } catch (err) { showError(err); }
}

async function submitReading() {
  try {
    const data = {
      sample_point: document.getElementById('point').value,
      min_limit: parseFloat(document.getElementById('minLimit').value),
      max_limit: parseFloat(document.getElementById('maxLimit').value),
      value: parseFloat(document.getElementById('value').value),
      read_at: document.getElementById('readAt').value,
    };
    show(await act('submit_reading', data));
  } catch (err) { showError(err); }
}

async function disposeAnomaly() {
  try {
    show(await act('dispose_anomaly', {
      anomaly_id: parseInt(document.getElementById('anomalyId').value, 10),
      disposition: document.getElementById('disposition').value,
    }));
  } catch (err) { showError(err); }
}

async function rollback() {
  try {
    show(await act('rollback', { reason: document.getElementById('rollbackReason').value || '现场异常' }));
  } catch (err) { showError(err); }
}

async function closeChange() {
  try {
    show(await act('close', { outcome: document.getElementById('outcome').value || '观察结束' }));
  } catch (err) { showError(err); }
}

function render() {
  document.getElementById('changeStatus').textContent = current.status;
  document.getElementById('changeVersion').textContent = current.version;
  const observation = current.data.observation;
  const summaryBox = document.getElementById('summary');
  const closeBox = document.getElementById('closeResult');
  summaryBox.innerHTML = '';
  closeBox.innerHTML = '';
  if (!observation) return;
  const s = observation.summary || {};
  const rows = (s.sample_points || []).map(p => `
    <tr>
      <td>${p.sample_point}</td>
      <td>${p.total_readings}</td>
      <td>${p.anomaly_count}</td>
      <td class="${p.unresolved_count ? 'bad' : 'ok'}">${p.unresolved_count}</td>
      <td>${p.latest_value === undefined ? '' : p.latest_value}</td>
      <td class="${p.latest_out_of_limit ? 'bad' : 'ok'}">${p.latest_out_of_limit ? '超限' : '正常'}</td>
      <td>${p.latest_read_at || ''}</td>
    </tr>`).join('');
  summaryBox.innerHTML = `
    <p>观察截止时间：${observation.deadline}｜读数总数：<b>${s.total_readings || 0}</b>
       ｜累计异常：<b class="${s.anomaly_count ? 'bad' : ''}">${s.anomaly_count || 0}</b>
       ｜未处置：<b class="${s.unresolved_count ? 'bad' : 'ok'}">${s.unresolved_count || 0}</b></p>
    <table><thead><tr>
      <th>采样点</th><th>上报次数</th><th>累计异常</th><th>未处置</th><th>最新读数</th><th>最新判断</th><th>最新读数时间</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  const result = current.data.observation_result;
  if (result) {
    const pointRows = result.sample_points.map(p =>
      `<li>${p.sample_point}：上报 ${p.total_readings} 次，异常 ${p.anomaly_count} 次，末值 ${p.latest_value}</li>`).join('');
    closeBox.innerHTML = `
      <h3 class="ok">关闭结果</h3>
      <ul>
        <li>观察截止时间：${result.deadline}</li>
        <li>读数总数：${result.total_readings}</li>
        <li>累计异常：${result.anomaly_count}</li>
        <li>关闭时间：${result.closed_at}</li>
      </ul>
      <ul>${pointRows}</ul>`;
  }
}

document.getElementById('deadline').value = localInput(Date.now() + 7 * 24 * 3600 * 1000);
document.getElementById('readAt').value = localInput(Date.now());
loadChanges().catch(showError);
</script>
</body>
</html>
